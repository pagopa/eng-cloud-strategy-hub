name: Release Please Google
description: Run release-please in manifest mode with conservative release PR auto-merge.
author: Cloud Strategy Governance

inputs:
  github_token:
    description: GitHub token used by release-please and gh CLI. Can be GITHUB_TOKEN or GitHub App installation token.
    required: true
  checkout:
    description: Whether the action should checkout the repository internally.
    required: false
    default: "true"
  target_branch:
    description: Target branch for release PRs.
    required: false
    default: main
  config_file:
    description: Path to release-please config file.
    required: false
    default: release-please-config.json
  manifest_file:
    description: Path to release-please manifest file.
    required: false
    default: .release-please-manifest.json
  auto_merge:
    description: Enable auto-merge for release-please PRs.
    required: false
    default: "true"
  merge_method:
    description: "Auto-merge method: merge, squash, or rebase."
    required: false
    default: squash
  skip_github_release:
    description: Skip creating GitHub Releases and tags. Useful for release PR tests on non-production branches.
    required: false
    default: "false"
  debug:
    description: Print non-secret diagnostic information.
    required: false
    default: "false"

outputs:
  release_created:
    description: Whether any release was created.
    value: ${{ steps.release.outputs.releases_created }}
  pr:
    description: Release PR URL, when available.
    value: ${{ steps.release_pr.outputs.pr }}
  prs:
    description: Release PRs JSON, when available.
    value: ${{ steps.release_pr.outputs.prs }}
  tag_name:
    description: Created tag name, when available.
    value: ${{ steps.release.outputs.tag_name }}
  config_file:
    description: Config file used.
    value: ${{ inputs.config_file }}
  manifest_file:
    description: Manifest file used.
    value: ${{ inputs.manifest_file }}
  auto_merge_enabled:
    description: Whether auto-merge was requested. Individual PRs may still require manual action.
    value: ${{ steps.release_pr.outputs.auto_merge_enabled }}
  releases_created:
    description: Whether release-please created at least one release.
    value: ${{ steps.release.outputs.releases_created }}
  paths_released:
    description: JSON array of paths released by release-please.
    value: ${{ steps.release.outputs.paths_released }}
  prs_created:
    description: Whether release-please created or updated at least one PR.
    value: ${{ steps.release.outputs.prs_created }}

runs:
  using: composite
  steps:
    - name: 🔍 Validate wrapper inputs
      id: validate_wrapper
      shell: bash
      env:
        ACTION_SCRIPT: ${{ github.action_path }}/scripts/validate_inputs.py
        GITHUB_TOKEN_INPUT: ${{ inputs.github_token }}
        CHECKOUT_INPUT: ${{ inputs.checkout }}
        TARGET_BRANCH_INPUT: ${{ inputs.target_branch }}
        AUTO_MERGE_INPUT: ${{ inputs.auto_merge }}
        SKIP_GITHUB_RELEASE_INPUT: ${{ inputs.skip_github_release }}
        MERGE_METHOD_INPUT: ${{ inputs.merge_method }}
        DEBUG_INPUT: ${{ inputs.debug }}
      run: |
        set -euo pipefail
        log_dir="${RUNNER_TEMP}/release-please"
        mkdir -p "${log_dir}"
        "${ACTION_SCRIPT}" --phase wrapper 2>&1 | tee "${log_dir}/validate-wrapper.log"

    - name: 🧭 Decide whether to checkout
      id: checkout_strategy
      shell: bash
      env:
        CHECKOUT_INPUT: ${{ inputs.checkout }}
      run: |
        set -euo pipefail

        should_checkout="${CHECKOUT_INPUT}"

        if git -C "${GITHUB_WORKSPACE}" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
          workspace_is_shallow="$(git -C "${GITHUB_WORKSPACE}" rev-parse --is-shallow-repository)"
          if [[ "${CHECKOUT_INPUT}" == "true" && "${workspace_is_shallow}" == "false" ]]; then
            should_checkout="false"
            echo "Workspace already contains a full Git checkout. Skipping internal checkout."
          fi
        fi

        printf 'should-checkout=%s\n' "${should_checkout}" >> "${GITHUB_OUTPUT}"

    - name: 📥 Checkout repository
      id: checkout
      if: ${{ steps.checkout_strategy.outputs.should-checkout == 'true' }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1 release: https://github.com/actions/checkout/releases/tag/v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
        token: ${{ inputs.github_token }}

    - name: 📋 Validate consumer release files
      id: validate_files
      shell: bash
      env:
        ACTION_SCRIPT: ${{ github.action_path }}/scripts/validate_inputs.py
        CONFIG_FILE_INPUT: ${{ inputs.config_file }}
        MANIFEST_FILE_INPUT: ${{ inputs.manifest_file }}
        DEBUG_INPUT: ${{ inputs.debug }}
        TARGET_BRANCH_INPUT: ${{ inputs.target_branch }}
        MERGE_METHOD_INPUT: ${{ inputs.merge_method }}
      run: |
        set -euo pipefail
        log_dir="${RUNNER_TEMP}/release-please"
        mkdir -p "${log_dir}"
        "${ACTION_SCRIPT}" --phase files 2>&1 | tee "${log_dir}/validate-files.log"

    - name: 🚀 Run release-please
      id: release
      uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # googleapis/release-please-action@v5.0.0 release: https://github.com/googleapis/release-please-action/releases/tag/v5.0.0
      with:
        token: ${{ inputs.github_token }}
        target-branch: ${{ inputs.target_branch }}
        config-file: ${{ inputs.config_file }}
        manifest-file: ${{ inputs.manifest_file }}
        skip-github-release: ${{ inputs.skip_github_release }}

    - name: 🔀 Resolve release PR and optionally enable auto-merge
      id: release_pr
      shell: bash
      env:
        ACTION_SCRIPT: ${{ github.action_path }}/scripts/auto_merge_release_pr.py
        GITHUB_TOKEN: ${{ inputs.github_token }}
        RP_TARGET_BRANCH: ${{ inputs.target_branch }}
        RP_AUTO_MERGE: ${{ inputs.auto_merge }}
        RP_MERGE_METHOD: ${{ inputs.merge_method }}
        RP_RELEASE_CREATED: ${{ steps.release.outputs.releases_created }}
        RP_SKIP_GITHUB_RELEASE: ${{ inputs.skip_github_release }}
        RP_PR: ${{ steps.release.outputs.pr }}
        RP_PRS: ${{ steps.release.outputs.prs }}
        RP_DEBUG: ${{ inputs.debug }}
      run: |
        set -euo pipefail
        log_dir="${RUNNER_TEMP}/release-please"
        mkdir -p "${log_dir}"
        "${ACTION_SCRIPT}" 2>&1 | tee "${log_dir}/auto-merge.log"

    - name: 📣 Publish step summary
      if: always()
      shell: bash
      env:
        ACTION_SCRIPT: ${{ github.action_path }}/scripts/generate_summary.py
        RP_TARGET_BRANCH: ${{ inputs.target_branch }}
        RP_AUTO_MERGE: ${{ inputs.auto_merge }}
        RP_MERGE_METHOD: ${{ inputs.merge_method }}
        RP_SKIP_GITHUB_RELEASE: ${{ inputs.skip_github_release }}
        RP_RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
        RP_RELEASES_CREATED: ${{ steps.release.outputs.releases_created }}
        RP_RELEASE_OUTPUTS_JSON: ${{ toJSON(steps.release.outputs) }}
        RP_TAG_NAME: ${{ steps.release.outputs.tag_name }}
        RP_VERSION: ${{ steps.release.outputs.version }}
        RP_HTML_URL: ${{ steps.release.outputs.html_url }}
        RP_PR: ${{ steps.release_pr.outputs.pr || steps.release.outputs.pr }}
        RP_PRS_CREATED: ${{ steps.release.outputs.prs_created }}
        RP_PATHS_RELEASED: ${{ steps.release.outputs.paths_released }}
        RP_LOG_DIR: ${{ runner.temp }}/release-please
        RP_STEP_OUTCOME: ${{ steps.release_pr.outcome }}
        RP_VALIDATE_WRAPPER_OUTCOME: ${{ steps.validate_wrapper.outcome }}
        RP_CHECKOUT_STRATEGY_OUTCOME: ${{ steps.checkout_strategy.outcome }}
        RP_CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
        RP_VALIDATE_FILES_OUTCOME: ${{ steps.validate_files.outcome }}
        RP_RELEASE_OUTCOME: ${{ steps.release.outcome }}
        RP_RELEASE_PR_OUTCOME: ${{ steps.release_pr.outcome }}
        RP_FAILURE_REASON: ${{ steps.release_pr.outputs.failure_reason || steps.validate_files.outputs.failure_reason || steps.validate_wrapper.outputs.failure_reason }}
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        set -euo pipefail
        mkdir -p "${RP_LOG_DIR}"

        has_failure="false"
        for outcome in \
          "${RP_VALIDATE_WRAPPER_OUTCOME}" \
          "${RP_CHECKOUT_STRATEGY_OUTCOME}" \
          "${RP_CHECKOUT_OUTCOME}" \
          "${RP_VALIDATE_FILES_OUTCOME}" \
          "${RP_RELEASE_OUTCOME}" \
          "${RP_RELEASE_PR_OUTCOME}"; do
          if [[ "${outcome}" == "failure" || "${outcome}" == "timed_out" ]]; then
            has_failure="true"
            break
          fi
        done

        if [[ "${has_failure}" == "true" ]] \
          && [[ -n "${GITHUB_RUN_ID:-}" ]] \
          && [[ -n "${GITHUB_JOB:-}" ]] \
          && command -v gh >/dev/null 2>&1; then
          github_log_tmp="${RP_LOG_DIR}/github-job.log.tmp"
          if gh run view "${GITHUB_RUN_ID}" \
            --job "${GITHUB_JOB}" \
            --log-failed > "${github_log_tmp}" 2>&1; then
            mv "${github_log_tmp}" "${RP_LOG_DIR}/github-job.log"
          else
            rm -f "${github_log_tmp}"
          fi
        fi

        "${ACTION_SCRIPT}"
