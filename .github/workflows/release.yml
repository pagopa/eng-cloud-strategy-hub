name: 🚀 Release

on:
  push:
    branches-ignore:
      - "release-please--**"
    paths-ignore:
      - "CODEOWNERS"
      - "**.md"
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Target branch for the release PR."
        type: string
        required: false
        default: main
      auto_merge:
        description: "Enable auto-merge for release PRs resolved by this run."
        type: boolean
        required: false
        default: true

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.target_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    # Manual releases execute the trusted workflow and local action from the
    # default branch. target_branch remains the release destination.
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: {}
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && 'release-manual' || 'release' }}
    steps:
      - name: Create release GitHub App token
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # actions/create-github-app-token@v3.2.0 release: https://github.com/actions/create-github-app-token/releases/tag/v3.2.0
        with:
          client-id: ${{ secrets.GH_APP_SIMPLE_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_SIMPLE_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1 release: https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.release-token.outputs.token }}

      - name: Run release action
        uses: ./actions/global/release-please-google
        with:
          github_token: ${{ steps.release-token.outputs.token }}
          checkout: "false"
          target_branch: ${{ github.event_name == 'workflow_dispatch' && inputs.target_branch || github.ref_name }}
          # Auto-merge is ON by default. It can be overridden via workflow_dispatch input.
          auto_merge: ${{ (github.event_name == 'workflow_dispatch' && inputs.auto_merge == false) && 'false' || 'true' }}
