name: Terraform Backup

on:
  pull_request:
    paths:
      - terraform/aws/modules/terraform-aws-backup/**
      - terraform/aws/modules/terraform-aws-backup-alerting/**
      - Makefile
      - .github/workflows/terraform-backup.yml
  push:
    branches: [main]
    paths:
      - terraform/aws/modules/terraform-aws-backup/**
      - terraform/aws/modules/terraform-aws-backup-alerting/**
      - Makefile
      - .github/workflows/terraform-backup.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-backup-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  TF_IN_AUTOMATION: "true"
  AWS_EC2_METADATA_DISABLED: "true"

jobs:
  native-tests:
    name: native-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6.0.2 release: https://github.com/actions/checkout/releases/tag/v6.0.2
        with:
          persist-credentials: false
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # hashicorp/setup-terraform@v4.0.1 release: https://github.com/hashicorp/setup-terraform/releases/tag/v4.0.1
        with:
          terraform_version: 1.14.3
          terraform_wrapper: false
      - name: Record runtime and native schemas
        run: |
          set -euo pipefail
          terraform version -json
          git rev-parse HEAD
          root=terraform/aws/modules/terraform-aws-backup/tests/fixtures/consumer
          terraform -chdir="$root" init -backend=false -input=false
          terraform -chdir="$root" providers schema -json > "$RUNNER_TEMP/backup-schema.json"
          jq '.provider_schemas["registry.terraform.io/hashicorp/aws"].resource_schemas |
            {plan: .aws_backup_plan, restore_plan: .aws_backup_restore_testing_plan,
             restore_selection: .aws_backup_restore_testing_selection}' "$RUNNER_TEMP/backup-schema.json"
      - name: Inspect and execute the native aggregate
        run: |
          set -euo pipefail
          make -n terraform-backup-check
          make terraform-backup-check
          git diff --check

  failure-propagation:
    name: failure-propagation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6.0.2 release: https://github.com/actions/checkout/releases/tag/v6.0.2
        with:
          persist-credentials: false
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # hashicorp/setup-terraform@v4.0.1 release: https://github.com/hashicorp/setup-terraform/releases/tag/v4.0.1
        with:
          terraform_version: 1.14.3
          terraform_wrapper: false
      - name: Require native assertion failure and restored success
        run: |
          set -euo pipefail
          test_file=terraform/aws/modules/terraform-aws-backup/tests/defaults.tftest.hcl
          backup_file="$(mktemp "$RUNNER_TEMP/backup-test.XXXXXX")"
          cp "$test_file" "$backup_file"
          trap 'cp "$backup_file" "$test_file"; rm -f "$backup_file"' EXIT
          cat >> "$test_file" <<'HCL'
          run "injected_aggregate_failure" {
            command = plan
            assert {
              condition     = length(aws_backup_vault.primary.name) < 0
              error_message = "BACKUP_AGGREGATE_FAILURE_PROBE"
            }
          }
          HCL
          terraform fmt "$test_file"
          set +e
          make terraform-backup-check > "$RUNNER_TEMP/backup-failure.log" 2>&1
          result=$?
          set -e
          if [ "$result" -eq 0 ]; then
            echo "::error::The aggregate ignored a failing native assertion."
            exit 1
          fi
          grep -F "BACKUP_AGGREGATE_FAILURE_PROBE" "$RUNNER_TEMP/backup-failure.log"
          cp "$backup_file" "$test_file"
          make terraform-backup-check
          git diff --check

  provider-minimum:
    name: provider-minimum
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6.0.2 release: https://github.com/actions/checkout/releases/tag/v6.0.2
        with:
          persist-credentials: false
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # hashicorp/setup-terraform@v4.0.1 release: https://github.com/hashicorp/setup-terraform/releases/tag/v4.0.1
        with:
          terraform_version: 1.14.3
          terraform_wrapper: false
      - name: Validate the exact AWS provider minimum
        run: |
          set -euo pipefail
          root=terraform/aws/modules/terraform-aws-backup/tests/fixtures/provider-minimum
          terraform -chdir="$root" init -backend=false -input=false
          terraform -chdir="$root" version -json
          terraform -chdir="$root" validate

  runtime-minimum:
    name: runtime-minimum
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6.0.2 release: https://github.com/actions/checkout/releases/tag/v6.0.2
        with:
          persist-credentials: false
      - name: Set up Terraform minimum
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # hashicorp/setup-terraform@v4.0.1 release: https://github.com/hashicorp/setup-terraform/releases/tag/v4.0.1
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false
      - name: Validate compatibility without executing mock tests
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/backup-bin"
          ln -s "$(command -v terraform)" "$RUNNER_TEMP/backup-bin/terraform-1.5"
          export PATH="$RUNNER_TEMP/backup-bin:$PATH"
          command -v terraform-1.5
          terraform-1.5 version -json
          root=terraform/aws/modules/terraform-aws-backup/tests/fixtures/provider-minimum
          terraform-1.5 -chdir="$root" init -backend=false -input=false
          terraform-1.5 -chdir="$root" validate
          make TERRAFORM=terraform-1.5 terraform-backup-init terraform-backup-validate

  workflow-lint:
    name: workflow-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6.0.2 release: https://github.com/actions/checkout/releases/tag/v6.0.2
        with:
          persist-credentials: false
      - name: Lint the workflow
        run: |
          set -euo pipefail
          command -v go
          export GOBIN="$RUNNER_TEMP/backup-bin"
          mkdir -p "$GOBIN"
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$GOBIN/actionlint" -version
          "$GOBIN/actionlint" .github/workflows/terraform-backup.yml
